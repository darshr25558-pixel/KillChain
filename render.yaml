services:
  - type: web
    name: hacktoberfest-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: false # Controlled via GitHub Actions Deploy Hook
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

